<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Messages · 50 Years of You</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --navy:#24324a;
  --ivory:#fbf6ee;
  --cream:#fffaf3;
  --gold:#c79552;
  --ink:#3a3440;
  --muted:#756f70;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:var(--ink);
  background:var(--ivory);
}

body{
  overflow-x:hidden;
}

/* =========================
   NAVIGATION
========================= */

nav{
  height:68px;
  background:rgba(36,50,74,.98);
  color:white;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 clamp(20px,5vw,80px);
}

.brand{
  font-family:Georgia,serif;
  font-size:20px;
}

.links{
  display:flex;
  gap:28px;
}

.links a{
  color:white;
  text-decoration:none;
  font-size:14px;
}

.links a:hover{
  color:#f0cfae;
}


/* =========================
   PAGE
========================= */

.messages-page{
  min-height:calc(100vh - 68px);
  background:#efe3d5;
  padding:42px 5vw 60px;
}

.messages-inner{
  width:min(1150px,100%);
  margin:auto;
}


/* =========================
   HEADER
========================= */

.section-head{
  text-align:center;
  max-width:700px;
  margin:0 auto 28px;
}

.eyebrow{
  letter-spacing:.18em;
  text-transform:uppercase;
  font-size:12px;
  margin-bottom:14px;
  color:#24324a;
}

.section-head h1{
  font-family:Georgia,serif;
  font-size:clamp(42px,5vw,64px);
  margin:0;
  color:var(--ink);
  font-weight:500;
}

.section-head p{
  color:var(--muted);
  line-height:1.6;
}


/* =========================
   MESSAGE GRID
========================= */

.message-wall{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}


/* =========================
   MESSAGE CARD
========================= */

.card{
  position:relative;

  background:var(--cream);
  color:var(--ink);

  border:1px solid #ead9c9;
  padding:24px;

  border-radius:18px;
  min-height:175px;

  box-shadow:0 12px 30px rgba(88,65,52,.12);

  cursor:pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease;

  /* IMPORTANT */
  pointer-events:auto;
  user-select:none;
}

.card:hover{
  transform:translateY(-5px) rotate(0deg);
  box-shadow:0 18px 38px rgba(88,65,52,.18);
}

.card:active{
  transform:scale(.985);
}

.card:focus{
  outline:3px solid rgba(199,149,82,.45);
  outline-offset:3px;
}


/* little rotations */

.card:nth-child(3n+1){
  transform:rotate(-1deg);
}

.card:nth-child(3n+2){
  transform:rotate(1.1deg);
}

.card:nth-child(3n){
  transform:rotate(-.5deg);
}

.card:nth-child(3n+1):hover,
.card:nth-child(3n+2):hover,
.card:nth-child(3n):hover{
  transform:translateY(-5px) rotate(0deg);
}


/* =========================
   CARD IMAGE
========================= */

.card img{
  width:100%;
  height:125px;

  object-fit:cover;

  border-radius:12px;
  margin-bottom:14px;

  display:block;

  pointer-events:none;
}


/* =========================
   CARD TEXT
========================= */

.msg{
  font-family:Georgia,serif;
  font-size:19px;
  line-height:1.5;

  /* Keep cards neat */
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:4;
  overflow:hidden;
}

.from{
  margin-top:16px;

  color:#6d6b65;
  font-size:13px;
  font-weight:600;
}


/* =========================
   EMPTY / ERROR
========================= */

.empty{
  text-align:center;
  color:#756f70;

  grid-column:1/-1;

  padding:40px;
}

.error{
  text-align:center;
  color:#8b4d45;

  grid-column:1/-1;

  padding:30px;

  background:rgba(255,250,243,.6);

  border-radius:16px;
}


/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;

  background:rgba(3,12,25,.78);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:9999;
}

.modal.show{
  display:flex;
}


/* =========================
   MODAL BOX
========================= */

.modal-box{
  width:min(720px,100%);
  max-height:92vh;

  overflow:auto;

  background:var(--cream);

  border-radius:22px;

  padding:32px;

  color:var(--ink);

  position:relative;

  box-shadow:0 30px 80px rgba(0,0,0,.3);
}


/* =========================
   FULL IMAGE
========================= */

.modal-image{
  width:100%;

  max-height:65vh;

  object-fit:contain;

  display:block;

  border-radius:14px;

  margin:0 auto 24px;

  background:#eee5da;
}


/* =========================
   MODAL MESSAGE
========================= */

.modal-eyebrow{
  letter-spacing:.18em;
  text-transform:uppercase;

  font-size:12px;

  color:#a0834b;

  margin-bottom:14px;
}

.modal-message{
  font-family:Georgia,serif;

  font-size:28px;

  line-height:1.5;

  white-space:pre-wrap;

  word-break:break-word;
}

.modal-from{
  margin-top:22px;

  font-weight:600;

  color:#5f5b57;
}


/* =========================
   CLOSE BUTTON
========================= */

.close{
  position:absolute;

  right:16px;
  top:16px;

  border:0;

  background:#eadfd4;

  color:#3a3440;

  border-radius:50%;

  width:38px;
  height:38px;

  cursor:pointer;

  font-size:22px;

  z-index:5;
}

.close:hover{
  background:#dccbbb;
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  .message-wall{
    grid-template-columns:repeat(2,1fr);
  }

}


@media(max-width:600px){

  nav{
    min-height:62px;
    height:auto;

    padding:10px 14px;

    gap:7px;

    flex-wrap:wrap;

    justify-content:center;
  }

  .brand{
    font-size:17px;

    width:100%;

    text-align:center;
  }

  .links{
    gap:8px 14px;

    flex-wrap:wrap;

    justify-content:center;
  }

  .links a{
    font-size:12px;
  }

  .messages-page{
    padding:24px 14px;
  }

  .section-head h1{
    font-size:40px;
    line-height:1;
  }

  .section-head p{
    font-size:14px;
  }

  .message-wall{
    grid-template-columns:1fr;
    gap:15px;
  }

  .card,
  .card:nth-child(n){
    transform:none;
  }

  .card:hover{
    transform:translateY(-4px);
  }

  .card{
    padding:20px;
    min-height:150px;
  }

  .msg{
    font-size:18px;
  }

  .modal{
    padding:12px;
  }

  .modal-box{
    max-height:94vh;

    padding:26px 18px;

    border-radius:18px;
  }

  .modal-image{
    max-height:55vh;
  }

  .modal-message{
    font-size:23px;
  }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width:360px){

  .links{
    gap:6px 10px;
  }

  .links a{
    font-size:11px;
  }

  .modal-message{
    font-size:21px;
  }

}

</style>
</head>


<body>


<!-- =========================
     NAV
========================= -->

<nav>

  <div class="brand">
    50 Years of You
  </div>

  <div class="links">

    <a href="index.html">
      Home
    </a>

    <a href="write.html">
      Send a Message
    </a>

    <a href="messages.html">
      Messages
    </a>

  </div>

</nav>



<!-- =========================
     MESSAGES
========================= -->

<main class="messages-page">

  <div class="messages-inner">

    <div class="section-head">

      <div class="eyebrow">
        From everyone who loves you
      </div>

      <h1>
        Birthday Messages
      </h1>

      <p>
        Click any message or photo to read the full wish.
      </p>

    </div>


    <div
      class="message-wall"
      id="wall"
    >

      <div class="empty">
        Loading messages…
      </div>

    </div>

  </div>

</main>



<!-- =========================
     MESSAGE MODAL
========================= -->

<div
  class="modal"
  id="viewModal"
>

  <div
    class="modal-box"
    id="modalBox"
  >

    <button
      class="close"
      id="closeButton"
      type="button"
      aria-label="Close"
    >
      ×
    </button>

    <div id="viewContent"></div>

  </div>

</div>



<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://yhgmtvcaptgvmqnczeuc.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_DUCqevIEFnRrJL4UuwiUoQ_wRYgIYD0";

let sb = null;


/* =========================
   START
========================= */

function startSite(){

  try{

    if(
      !window.supabase ||
      !window.supabase.createClient
    ){

      showError(
        "The message service could not load. Please refresh the page."
      );

      return;
    }


    sb =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    loadMessages();


    enableRealtime();


  }catch(error){

    console.error(error);

    showError(
      "Could not connect to the message service."
    );

  }

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  const wall =
    document.getElementById("wall");


  wall.innerHTML =
    '<div class="empty">Loading messages…</div>';


  try{

    const result =
      await sb
        .from("messages")
        .select("*")
        .order(
          "created_at",
          {ascending:false}
        );


    if(result.error){

      console.error(
        "Supabase error:",
        result.error
      );

      showError(
        "Could not load messages. Please refresh and try again."
      );

      return;
    }


    renderMessages(
      result.data || []
    );


  }catch(error){

    console.error(error);

    showError(
      "Something went wrong while loading the messages."
    );

  }

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(data){

  const wall =
    document.getElementById("wall");


  wall.innerHTML = "";


  if(!data.length){

    wall.innerHTML =
      '<div class="empty">' +
      'Be the first to leave a birthday wish.' +
      '</div>';

    return;
  }


  data.forEach(function(m,index){

    const card =
      document.createElement("article");


    card.className = "card";


    /*
      IMPORTANT:
      Make the WHOLE CARD clickable.
    */

    card.setAttribute(
      "tabindex",
      "0"
    );

    card.setAttribute(
      "role",
      "button"
    );

    card.setAttribute(
      "aria-label",
      "Open birthday message from " +
      (m.name || "guest")
    );


    /*
      CLICK
    */

    card.addEventListener(
      "click",
      function(event){

        event.preventDefault();

        openMessage(m);

      }
    );


    /*
      KEYBOARD
    */

    card.addEventListener(
      "keydown",
      function(event){

        if(
          event.key === "Enter" ||
          event.key === " "
        ){

          event.preventDefault();

          openMessage(m);

        }

      }
    );


    /*
      IMAGE
    */

    if(m.photo_url){

      const img =
        document.createElement("img");


      img.src =
        m.photo_url;


      img.alt =
        "Birthday photo";


      img.loading =
        index < 6
          ? "eager"
          : "lazy";


      /*
        Image itself doesn't intercept
        the card click.
      */

      img.style.pointerEvents =
        "none";


      card.appendChild(img);

    }


    /*
      MESSAGE
    */

    const message =
      document.createElement("div");


    message.className =
      "msg";


    message.textContent =
      m.message || "";


    card.appendChild(message);


    /*
      NAME
    */

    const from =
      document.createElement("div");


    from.className =
      "from";


    from.textContent =
      "— " + (m.name || "Anonymous");


    card.appendChild(from);


    /*
      ADD TO PAGE
    */

    wall.appendChild(card);

  });

}


/* =========================
   OPEN FULL MESSAGE
========================= */

function openMessage(m){

  const modal =
    document.getElementById("viewModal");


  const content =
    document.getElementById("viewContent");


  /*
    Clear previous message
  */

  content.innerHTML = "";


  /*
    FULL IMAGE
  */

  if(m.photo_url){

    const img =
      document.createElement("img");


    img.className =
      "modal-image";


    img.src =
      m.photo_url;


    img.alt =
      "Birthday photo";


    /*
      contain = NEVER CROP
    */

    img.style.objectFit =
      "contain";


    content.appendChild(img);

  }


  /*
    EYEBROW
  */

  const eyebrow =
    document.createElement("div");


  eyebrow.className =
    "modal-eyebrow";


  eyebrow.textContent =
    "A birthday wish";


  content.appendChild(eyebrow);


  /*
    FULL MESSAGE
  */

  const message =
    document.createElement("div");


  message.className =
    "modal-message";


  message.textContent =
    m.message || "";


  content.appendChild(message);


  /*
    NAME
  */

  const from =
    document.createElement("div");


  from.className =
    "modal-from";


  from.textContent =
    "— " + (m.name || "Anonymous");


  content.appendChild(from);


  /*
    SHOW MODAL
  */

  modal.classList.add("show");


  /*
    Prevent page behind from scrolling
  */

  document.body.style.overflow =
    "hidden";

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

  document
    .getElementById("viewModal")
    .classList.remove("show");


  document.body.style.overflow =
    "";

}


/* =========================
   CLOSE BUTTON
========================= */

document
  .getElementById("closeButton")
  .addEventListener(
    "click",
    function(event){

      event.stopPropagation();

      closeModal();

    }
  );


/* =========================
   CLICK OUTSIDE MODAL
========================= */

document
  .getElementById("viewModal")
  .addEventListener(
    "click",
    function(event){

      if(
        event.target ===
        document.getElementById("viewModal")
      ){

        closeModal();

      }

    }
  );


/* =========================
   ESC KEY
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeModal();

    }

  }
);


/* =========================
   ERROR
========================= */

function showError(text){

  const wall =
    document.getElementById("wall");


  wall.innerHTML =
    '<div class="error">' +
    escapeHtml(text) +
    '</div>';

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   REALTIME
========================= */

function enableRealtime(){

  if(!sb) return;


  sb
    .channel("messages-live")

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"messages"
      },

      function(){

        loadMessages();

      }
    )

    .subscribe();

}


/* =========================
   RUN
========================= */

if(
  document.readyState === "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    startSite
  );

}else{

  startSite();

}

</script>

</body>
</html>
