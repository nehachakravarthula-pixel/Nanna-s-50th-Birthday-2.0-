<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Send a Message · 50 Years of You</title>

<style>
:root{
  --navy:#24324a;
  --navy2:#35435c;
  --ivory:#fbf6ee;
  --cream:#fffaf3;
  --gold:#c79552;
  --peach:#e9b39b;
  --rose:#c97970;
  --ink:#3a3440;
  --muted:#756f70;
  --white:#fff
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:var(--ink);
  background:var(--ivory)
}

body{overflow-x:hidden}

nav{
  height:68px;
  background:rgba(36,50,74,.98);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(20px,5vw,80px)
}

.brand{
  font-family:Georgia,serif;
  font-size:20px
}

.links{
  display:flex;
  gap:28px
}

.links a{
  color:#fff;
  text-decoration:none;
  font-size:14px
}

.links a:hover{
  color:#f0cfae
}

.page{
  min-height:calc(100vh - 68px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 5vw
}

.full-page{
  background:var(--ivory)
}

.write-card{
  background:var(--cream);
  width:min(700px,100%);
  padding:34px;
  border-radius:24px;
  box-shadow:0 20px 55px rgba(61,49,43,.14);
  border:1px solid #ead9c9
}

.write-card h1{
  font-family:Georgia,serif;
  font-size:42px;
  margin:0 0 10px;
  color:var(--navy)
}

.intro{
  color:var(--muted);
  line-height:1.7;
  margin:0 0 25px
}

.form-row{
  margin-bottom:17px
}

.form-row label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px
}

.form-row input,
.form-row textarea{
  width:100%;
  border:1px solid #decfc2;
  border-radius:12px;
  padding:13px 14px;
  font:inherit;
  background:#fff
}

.form-row textarea{
  min-height:170px;
  resize:vertical
}

.media-preview{
  width:100%;
  max-height:360px;
  object-fit:contain;
  background:#f1e8df;
  border-radius:14px;
  margin-top:12px;
  display:none
}

.video-preview{
  width:100%;
  max-height:360px;
  background:#111;
  border-radius:14px;
  margin-top:12px;
  display:none
}

.file-name{
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
  display:none
}

.status{
  font-size:13px;
  margin-top:12px;
  color:#667085;
  line-height:1.5
}

.back{
  display:inline-block;
  margin-bottom:20px;
  color:var(--navy);
  text-decoration:none;
  font-weight:600
}

.btn{
  border:0;
  border-radius:999px;
  padding:14px 23px;
  font:600 15px Arial,sans-serif;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:linear-gradient(135deg,#c79552,#d68f79);
  color:#fff;
  box-shadow:0 10px 25px rgba(0,0,0,.16);
  width:100%
}

.btn:hover{
  transform:translateY(-2px)
}

.btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none
}

@media(max-width:600px){

  nav{
    min-height:62px;
    height:auto;
    padding:10px 14px;
    gap:7px;
    flex-wrap:wrap;
    justify-content:center
  }

  .brand{
    font-size:17px;
    width:100%;
    text-align:center
  }

  .links{
    gap:8px 14px;
    flex-wrap:wrap;
    justify-content:center
  }

  .links a{
    font-size:12px
  }

  .page{
    min-height:calc(100vh - 62px);
    padding:18px 12px
  }

  .write-card{
    width:100%;
    padding:22px 16px;
    border-radius:18px
  }

  .write-card h1{
    font-size:30px;
    line-height:1.08
  }

  .intro{
    font-size:14px;
    line-height:1.55
  }

  .form-row input,
  .form-row textarea{
    font-size:16px;
    min-height:48px
  }

  .form-row textarea{
    min-height:155px
  }

  .btn{
    min-height:48px
  }

  .media-preview,
  .video-preview{
    max-height:300px
  }
}
</style>
</head>

<body>

<nav>
  <div class="brand">50 Years of You</div>

  <div class="links">
    <a href="index.html">Home</a>
    <a href="write.html">Send a Message</a>
    <a href="messages.html">Messages</a>
  </div>
</nav>


<main class="page full-page">

  <div class="write-card">

    <a class="back" href="index.html">← Back to Home</a>

    <h1>Send a Birthday Message 💌</h1>

    <p class="intro">
      Write a wish, memory, or something you love about Nanna.
      You can add a photo or a video too, if you’d like.
    </p>


    <div class="form-row">

      <label>Your Name</label>

      <input
        id="name"
        maxlength="80"
        placeholder="e.g. Priya, Rahul, Family…"
      >

    </div>


    <div class="form-row">

      <label>Your Birthday Wish</label>

      <textarea
        id="message"
        maxlength="3000"
        placeholder="Write your birthday wish, memory, or something you love about Nanna…"
      ></textarea>

    </div>


    <div class="form-row">

      <label>
        Add a Photo or Video
        <span style="font-weight:400;color:#8a807b">
          (optional)
        </span>
      </label>

      <input
        id="photo"
        type="file"
        accept="image/*,video/*"
        onchange="previewMedia()"
      >

      <div
        class="file-name"
        id="fileName"
      ></div>


      <img
        class="media-preview"
        id="imagePreview"
        alt="Selected photo preview"
      >


      <video
        class="video-preview"
        id="videoPreview"
        controls
        playsinline
      ></video>

    </div>


    <button
      class="btn"
      id="sendButton"
      onclick="submitMessage()"
    >
      Send Message 💌
    </button>


    <div
      class="status"
      id="status"
    ></div>

  </div>

</main>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://yhgmtvcaptgvmqnczeuc.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_DUCqevIEFnRrJL4UuwiUoQ_wRYgIYD0";

let sb = null;


/* =========================
   START
========================= */

function startSite(){

  try{

    if(
      !window.supabase ||
      !window.supabase.createClient
    ){

      loadSupabase();

      return;
    }

    sb = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

  }catch(error){

    console.error(error);

    document.getElementById("status").textContent =
      "Could not connect to the message service.";

  }

}


/* =========================
   LOAD SUPABASE
========================= */

function loadSupabase(){

  const script =
    document.createElement("script");

  script.src =
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

  script.onload = function(){

    sb =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

  };

  script.onerror = function(){

    document.getElementById("status").textContent =
      "The message service could not load. Please refresh.";

  };

  document.head.appendChild(script);

}


/* =========================
   PREVIEW PHOTO OR VIDEO
========================= */

function previewMedia(){

  const file =
    document.getElementById("photo").files[0];

  const imagePreview =
    document.getElementById("imagePreview");

  const videoPreview =
    document.getElementById("videoPreview");

  const fileName =
    document.getElementById("fileName");


  imagePreview.style.display = "none";
  videoPreview.style.display = "none";

  imagePreview.removeAttribute("src");
  videoPreview.removeAttribute("src");

  fileName.style.display = "none";
  fileName.textContent = "";


  if(!file){
    return;
  }


  fileName.textContent =
    file.name;

  fileName.style.display =
    "block";


  const url =
    URL.createObjectURL(file);


  if(file.type.startsWith("video/")){

    videoPreview.src = url;
    videoPreview.style.display = "block";

  }else if(file.type.startsWith("image/")){

    imagePreview.src = url;
    imagePreview.style.display = "block";

  }

}


/* =========================
   SEND MESSAGE
========================= */

async function submitMessage(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();

  const message =
    document
      .getElementById("message")
      .value
      .trim();

  const file =
    document
      .getElementById("photo")
      .files[0];

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("sendButton");


  if(!name || !message){

    status.textContent =
      "Please enter your name and message.";

    return;
  }


  if(!sb){

    status.textContent =
      "The message service is still loading. Please try again in a moment.";

    return;
  }


  button.disabled = true;

  status.textContent =
    "Sending…";


  try{

    let photo_url = null;


    /* =========================
       UPLOAD PHOTO OR VIDEO
    ========================= */

    if(file){

      const ext =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const path =
        `${crypto.randomUUID()}.${ext}`;


      const upload =
        await sb
          .storage
          .from("message-photos")
          .upload(
            path,
            file,
            {
              contentType:file.type,
              upsert:false
            }
          );


      if(upload.error){

        console.error(
          "Upload error:",
          upload.error
        );

        status.textContent =
          "Photo/video upload failed. Please try again.";

        button.disabled = false;

        return;
      }


      photo_url =
        sb
          .storage
          .from("message-photos")
          .getPublicUrl(path)
          .data
          .publicUrl;

    }


    /* =========================
       SAVE MESSAGE
    ========================= */

    const insert =
      await sb
        .from("messages")
        .insert({
          name:name,
          message:message,
          photo_url:photo_url
        });


    if(insert.error){

      console.error(
        "Database error:",
        insert.error
      );

      status.textContent =
        insert.error.message;

      button.disabled = false;

      return;
    }


    /* =========================
       SUCCESS
    ========================= */

    status.textContent =
      "Your message has been added ❤️";


    document.getElementById("name").value = "";

    document.getElementById("message").value = "";

    document.getElementById("photo").value = "";


    document.getElementById("imagePreview").style.display =
      "none";

    document.getElementById("videoPreview").style.display =
      "none";

    document.getElementById("fileName").style.display =
      "none";


  }catch(error){

    console.error(error);

    status.textContent =
      "Something went wrong. Please try again.";

  }


  button.disabled = false;

}


/* =========================
   START
========================= */

if(
  document.readyState === "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    startSite
  );

}else{

  startSite();

}

</script>

</body>
</html>
